<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="assets/css/weather.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>Weather Dashboard</h1>
      <form id="search-form" aria-label="Search for city">
        <input id="search-input" type="search" placeholder="Enter city (e.g. London)" aria-label="City name">
        <button type="submit">Search</button>
      </form>
    </header>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="current" class="card current" hidden>
      <div class="current-left">
        <img id="current-icon" src="" alt="" aria-hidden="true" width="96" height="96">
        <div class="temp-wrap">
          <div id="current-temp" class="temp"></div>
          <div id="current-desc" class="desc"></div>
        </div>
      </div>
      <div class="current-right">
        <div><strong>Location:</strong> <span id="current-location"></span></div>
        <div><strong>Wind:</strong> <span id="current-wind"></span></div>
        <div><strong>Time:</strong> <span id="current-time"></span></div>
      </div>
    </section>

    <section id="hourly" class="card" hidden>
      <h2>Next 24 hours</h2>
      <div id="hourly-strip" class="hourly-strip" role="list"></div>
    </section>

    <section id="daily" class="card" hidden>
      <h2>7‑Day Forecast</h2>
      <div id="daily-cards" class="daily-grid"></div>
    </section>

    <footer class="footer">
      <small>Data from Open‑Meteo (no API key required) · Demo dashboard</small>
    </footer>
  </main>

  <script src="assets/js/weather.js" defer></script>
</body>
</html>

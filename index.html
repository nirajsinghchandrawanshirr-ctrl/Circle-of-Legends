<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle of Legends - Niraj Singh Chandravanshi</title>
  <!-- FontAwesome for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    .profile-img {
background-image: url('profilenew.jpg');
background-size: cover; 
background-position: center; }


    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      background-color: #0d0f12;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Dynamic Background Container */
    #bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      transition: background-image 0.8s ease-in-out;
      filter: brightness(0.4);
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    main {
      flex: 1;
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
      width: 95%;
    }

    /* Profile & Social Media Card */
    .profile-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-img {

      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
    }

    .profile-text h2 {
      font-size: 1.5rem;
      color: #fff;
    }

    .profile-text p {
      font-size: 0.9rem;
      color: #00ffcc;
      margin-top: 3px;
    }

    .social-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .social-links a {
      color: #fff;
      font-size: 1.4rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .social-links a:hover {
      background: #00ffcc;
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
    }

    /* Profile Theme Song Section */
    .theme-song-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .theme-song-card h3 {
      font-size: 1rem;
      color: #00ffcc;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Navigation Buttons / Categories */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .category-btn {
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .category-btn:hover, .category-btn.active {
      background: #00ffcc;
      color: #000;
      border-color: #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }

    /* Music Player Container */
    .player-container {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .player-header {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #00ffcc;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    iframe {
      border-radius: 12px;
      width: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.8);
      font-size: 0.85rem;
      color: #888;
    }

    @media (max-width: 600px) {
      .profile-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Background -->
  <div id="bg-container"></div>

  <header>
    <h1>CIRCLE OF LEGENDS</h1>
  </header>

  <main>
    <!-- Profile & Social Links Section -->
    <div class="profile-card">
      <div class="profile-info">
        <img src="profile.jpg" alt="Niraj Singh Chandravanshi" class="profile-img">
        <div class="profile-text">

          <p><i class="fas fa-headphones-alt"></i> Welcome to My World</p>
        </div>
      </div>
      <div class="social-links">
        <a href="https://www.instagram.com/niraj.singh.chandravanshi18?igsh=MWdsc25ibzM2MXFkMw==" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.youtube.com/@NSC_X" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://x.com/NirajSingh7366" target="_blank" title="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
        <a href="https://www.threads.com/@niraj_singh.chandravanshi" target="_blank" title="Threads"><i class="fas fa-at"></i></a>
      </div>
    </div>

    <!-- Profile Theme Song Player -->
    <div class="theme-song-card">
      <h3><i class="fas fa-heart"></i> Profile Theme Song</h3>
      <iframe src="https://open.spotify.com/embed/track/7Csa4PStpuYIfUqNMKQ4V8?utm_source=generator&theme=0" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Category Selector Grid -->
    <div class="category-grid" id="category-grid"></div>

    <!-- Music Player Section -->
    <div class="player-container">
      <div class="player-header">
        <i class="fas fa-music"></i>
        <span id="current-title">Meditation & Yoga</span>
      </div>
      <iframe id="spotify-player" height="380" src="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </main>

  <footer>
    &copy; 2026 Niraj Singh Chandravanshi | Circle of Legends
  </footer>

  <script>
    const playlists = [
      {
        name: "Meditation & Yoga",
        id: "37i9dQZF1DWZqd5JICZI0u",
        bg: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Nature Sound",
        id: "37i9dQZF1DX4PP3DA4J0N8",
        bg: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Old Is Gold",
        id: "5pXV7brN2OYdhX7BaYzR7G",
        bg: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Arijit Singh",
        id: "7qxn6GsFH77ghVtKzOnAYA",
        bg: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Darshan Raval",
        id: "6TpAeSeDRpmy6BImy4XYzU",
        bg: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Guru Randhawa",
        id: "77nS1AY8nzIJ9LFalzx0xq",
        bg: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Love 💕",
        id: "37i9dQZF1DXdpQPPZq3F7n",
        bg: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "Honey Singh",
        id: "7a7gtZeFL0puQpRS2x7Pib",
        bg: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=1920&q=80"
      },
      {
        name: "All Time Hits",
        id: "7sTkp2X5Aq84v9w9UtfkaF",
        bg: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&w=1920&q=80"
      }
    ];

    const grid = document.getElementById('category-grid');
    const iframe = document.getElementById('spotify-player');
    const bgContainer = document.getElementById('bg-container');
    const titleText = document.getElementById('current-title');

    playlists.forEach((item, index) => {
      const btn = document.createElement('button');
      btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
      btn.innerText = item.name;
      btn.onclick = () => selectPlaylist(index, btn);
      grid.appendChild(btn);
    });

    function selectPlaylist(index, element) {
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');

      const data = playlists[index];
      iframe.src = `https://open.spotify.com/embed/playlist/${data.id}?utm_source=generator&theme=0`;
      bgContainer.style.backgroundImage = `url('${data.bg}')`;
      titleText.innerText = data.name;
    }

    selectPlaylist(0, grid.children[0]);
  </script>
</body>
</html>

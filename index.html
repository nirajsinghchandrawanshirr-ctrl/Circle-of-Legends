<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Circle of Legends - Niraj Singh Chandravanshi: music playlists, social links and profile theme song." />
  <meta name="theme-color" content="#00ffcc" />
  <title>Circle of Legends - Niraj Singh Chandravanshi</title>

  <!-- FontAwesome for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* Basic reset & layout */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { height: 100%; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      background-color: #0d0f12;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Skip link for keyboard users */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      padding: 0.5rem 1rem;
      background: #00ffcc;
      color: #000;
      z-index: 9999;
      border-radius: 6px;
      text-decoration: none;
    }

    /* Dynamic Background Container with overlay for contrast */
    #bg-container {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      transition: background-image 0.6s ease-in-out;
      filter: brightness(0.6);
    }
    /* overlay to improve text contrast */
    #bg-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,15,18,0.45), rgba(13,15,18,0.75));
      z-index: -1;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0,255,204,0.45);
    }

    main {
      flex: 1;
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
      width: 95%;
    }

    /* Profile & Social Card */
    .profile-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .profile-info { display: flex; align-items: center; gap: 14px; }
    .profile-img {
      width: 85px; height: 85px; border-radius: 50%; object-fit: cover;
      border: 3px solid #00ffcc; box-shadow: 0 0 12px rgba(0,255,204,0.45);
      background: #222;
    }
    .profile-text h2 { font-size: 1.4rem; color: #fff; }
    .profile-text p { font-size: 0.92rem; color: #00ffcc; margin-top: 4px; display:flex; align-items:center; gap:8px; }

    .social-links { display:flex; gap:12px; flex-wrap:wrap; }
    .social-links a {
      color: #fff; font-size: 1.25rem;
      width: 42px; height: 42px; border-radius:50%;
      background: rgba(255,255,255,0.08);
      display:flex; align-items:center; justify-content:center; transition: all 0.25s ease;
      text-decoration:none;
    }
    .social-links a:hover, .social-links a:focus {
      background: #00ffcc; color: #000; transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,255,204,0.35);
      outline: none;
    }

    /* Theme song card */
    .theme-song-card {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,204,0.22);
      border-radius: 12px; padding: 14px; margin-bottom: 20px;
    }
    .theme-song-card h3 {
      font-size: 1rem; color: #00ffcc; margin-bottom: 8px; display:flex; gap:8px; align-items:center;
    }

    /* Category grid */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 22px;
    }
    .category-btn {
      padding: 12px 14px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #fff; font-weight:600; cursor:pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
      backdrop-filter: blur(4px);
    }
    .category-btn:hover { transform: translateY(-3px); }
    .category-btn.active {
      background: #00ffcc; color: #000; border-color: #00ffcc;
      box-shadow: 0 8px 30px rgba(0,255,204,0.18);
    }
    .category-btn:focus {
      outline: 3px solid rgba(0,255,204,0.18);
      outline-offset: 2px;
    }

    /* Player container */
    .player-container {
      background: rgba(0,0,0,0.68); backdrop-filter: blur(14px);
      border-radius: 14px; padding: 18px; border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .player-header {
      margin-bottom: 12px; font-size: 1.12rem; color: #00ffcc; display:flex; gap:10px; align-items:center;
    }
    iframe { border-radius: 12px; width:100%; border: none; }

    footer {
      text-align:center; padding:14px; background: rgba(0,0,0,0.78); font-size:0.85rem; color:#888;
    }

    /* Screen-reader helper */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px; overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px); white-space: nowrap;
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    @media (max-width:600px) {
      .profile-card { flex-direction: column; align-items:flex-start; }
      iframe[height] { height: 260px; }
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Dynamic Background -->
  <div id="bg-container" aria-hidden="true"></div>

  <header>
    <h1>CIRCLE OF LEGENDS</h1>
  </header>

  <main id="main" tabindex="-1">
    <!-- Profile & Social Links Section -->
    <div class="profile-card" aria-labelledby="profile-name" role="group">
      <div class="profile-info">
        <img src="https://avatars.githubusercontent.com/u/316144858?v=4" alt="Profile photo of Niraj Singh Chandravanshi" class="profile-img" loading="lazy" />
        <div class="profile-text">
          <h2 id="profile-name">Niraj Singh Chandravanshi</h2>
          <p><i class="fas fa-headphones-alt" aria-hidden="true"></i> <span class="sr-only">Greeting:</span> Welcome to My World</p>
        </div>
      </div>

      <div class="social-links" aria-label="Social links">
        <a href="https://www.instagram.com/niraj.singh.chandravanshi18?igsh=MWdsc25ibzM2MXFkMw==" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
          <i class="fab fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://www.youtube.com/@NSC_X" target="_blank" rel="noopener noreferrer" title="YouTube" aria-label="YouTube">
          <i class="fab fa-youtube" aria-hidden="true"></i>
        </a>
        <a href="https://x.com/NirajSingh7366" target="_blank" rel="noopener noreferrer" title="X" aria-label="X">
          <i class="fab fa-x" aria-hidden="true"></i>
        </a>
        <a href="https://www.threads.com/@niraj_singh.chandravanshi" target="_blank" rel="noopener noreferrer" title="Threads" aria-label="Threads">
          <i class="fas fa-at" aria-hidden="true"></i>
        </a>
      </div>
    </div>

    <!-- Profile Theme Song Player -->
    <div class="theme-song-card">
      <h3><i class="fas fa-heart" aria-hidden="true"></i> Profile Theme Song</h3>
      <iframe src="https://open.spotify.com/embed/track/7Csa4PStpuYIfUqNMKQ4V8?utm_source=generator&theme=0" height="152" title="Profile theme song - Spotify" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Category Selector Grid -->
    <div class="category-grid" id="category-grid" role="list" aria-label="Playlist categories"></div>

    <!-- Music Player Section -->
    <div class="player-container" aria-live="polite">
      <div class="player-header">
        <i class="fas fa-music" aria-hidden="true"></i>
        <span id="current-title">Meditation &amp; Yoga</span>
      </div>
      <iframe id="spotify-player" height="380" src="" title="Spotify playlist player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <p class="sr-only" id="player-fallback-text">If the Spotify player doesn't load, use the playlist link provided in each category.</p>
    </div>
  </main>

  <footer>
    &copy; 2026 Niraj Singh Chandravanshi | Circle of Legends
  </footer>

  <script>
    const playlists = [
      { name: "Meditation & Yoga", id: "37i9dQZF1DWZqd5JICZI0u", bg: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1920&q=80" },
      { name: "Nature Sound", id: "37i9dQZF1DX4PP3DA4J0N8", bg: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80" },
      { name: "Old Is Gold", id: "5pXV7brN2OYdhX7BaYzR7G", bg: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1920&q=80" },
      { name: "Arijit Singh", id: "7qxn6GsFH77ghVtKzOnAYA", bg: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80" },
      { name: "Darshan Raval", id: "6TpAeSeDRpmy6BImy4XYzU", bg: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1920&q=80" },
      { name: "Guru Randhawa", id: "77nS1AY8nzIJ9LFalzx0xq", bg: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1920&q=80" },
      { name: "Love 💕", id: "37i9dQZF1DXdpQPPZq3F7n", bg: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80" },
      { name: "Honey Singh", id: "7a7gtZeFL0puQpRS2x7Pib", bg: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=1920&q=80" },
      { name: "All Time Hits", id: "7sTkp2X5Aq84v9w9UtfkaF", bg: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&w=1920&q=80" }
    ];

    const grid = document.getElementById('category-grid');
    const iframe = document.getElementById('spotify-player');
    const bgContainer = document.getElementById('bg-container');
    const titleText = document.getElementById('current-title');

    // Build the category buttons (role=list -> role=listitem not needed for simple cases but we use buttons)
    playlists.forEach((item, index) => {
      const btn = document.createElement('button');
      btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
      btn.type = 'button';
      btn.innerText = item.name;
      btn.setAttribute('aria-pressed', index === 0 ? 'true' : 'false');
      btn.dataset.idx = index;
      btn.addEventListener('click', () => selectPlaylist(index, btn));
      // keyboard interaction is native with button (Enter/Space)
      grid.appendChild(btn);
    });

    function selectPlaylist(index, element) {
      const buttons = document.querySelectorAll('.category-btn');
      buttons.forEach((btn, i) => {
        const isActive = i === index;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });

      const data = playlists[index];
      // set the spotify embed URL
      iframe.src = `https://open.spotify.com/embed/playlist/${encodeURIComponent(data.id)}?utm_source=generator&theme=0`;
      // update accessible title text
      titleText.innerText = data.name;
      // change background image (with safe URL quoting)
      bgContainer.style.backgroundImage = `url('${data.bg}')`;

      // ensure focus visible for keyboard users
      if (element && typeof element.focus === 'function') {
        element.focus();
      }
    }

    // Initialize player (set initial playlist)
    selectPlaylist(0, grid.querySelector('.category-btn'));

    // Fallback: if iframe fails to load after a short timeout, show a small notice in console and keep ability to click categories
    // (You may replace with UI fallback displayed to users if desired)
    setTimeout(() => {
      if (!iframe.contentWindow) {
        console.debug('Spotify iframe may be blocked or slow to load. Consider displaying a fallback playlist link.');
      }
    }, 4000);
  </script>
</body>
</html>
